<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="CiteApply">
  <!--
    The product's own mark, in the product's own two colours: a record with a
    citation rule down its left edge in the evidence teal, and one line left
    unwritten in the judgment ochre - the answer the site will not supply.
  -->
  <rect width="32" height="32" rx="6" fill="#0f6e6b"/>
  <rect x="8" y="6" width="16" height="20" rx="1.5" fill="#fafbfc"/>
  <rect x="8" y="6" width="2.5" height="20" fill="#8c4b05"/>
  <rect x="13" y="10" width="8" height="2" rx="1" fill="#0f6e6b"/>
  <rect x="13" y="14.5" width="8" height="2" rx="1" fill="#0f6e6b"/>
  <rect x="13" y="19" width="5" height="2" rx="1" fill="#8c4b05"/>
</svg>
